# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'catppuccin/tmux'

set -sg escape-time 10
set -g mouse on
set -g detach-on-destroy off
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# change prefix
unbind C-b
set -g prefix C-t

# default setting
set-option -g default-shell /usr/bin/zsh

# enable OSC 52 clipboard
set -g set-clipboard on

# paste mode
setw -g mode-keys vi
bind-key v copy-mode \; display "Copy mode!"
unbind-key -T copy-mode-vi Space; bind-key -T copy-mode-vi v send-keys -X begin-selection
unbind-key -T copy-mode-vi C-v; bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle

# reload config
bind-key r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Claude Code prompt editing with nvim popup
bind-key C-g display-popup -E -w 80% -h 80% "zsh -ic 'claude-prompt-edit #{pane_id}'"

# catppuccin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W#{?#{!=:#T,#H},: #T,}"
set -g @catppuccin_window_current_text " #W#{?#{!=:#T,#H},: #T,}"

# status line
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-justify centre

# pane border
set -g pane-border-format ' #{?pane_active,#[fg=#7aa2f7#,bold],#[fg=#565f89]}#{pane_index}: (#{pane_current_command})#{?pane_title, #{pane_title},} '
set -g pane-border-indicators off
set -g pane-border-status top

run '~/.config/tmux/plugins/tpm/tpm'

# Build status-right after catppuccin is loaded.
# Use -F on cpu so the catppuccin variable expands at set time, leaving the
# literal #{cpu_percentage} placeholder in status-right for tmux-cpu to
# substitute below.
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_date_time}"
set -ag status-right "#{E:@catppuccin_status_host}"

# Re-run cpu plugin now that status-right contains the literal
# #{cpu_percentage} placeholder.
run '~/.config/tmux/plugins/tmux-cpu/cpu.tmux'
